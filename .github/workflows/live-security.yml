name: Live portal security checks
on:
  pull_request:
    paths: ['recovered-live/**', 'services/whatsapp/**', '.github/workflows/live-security.yml']
  push:
    branches: [main, agent/personalizar-mensagens-agentes]
    paths: ['recovered-live/**', 'services/whatsapp/**', '.github/workflows/live-security.yml']
permissions:
  contents: read
concurrency:
  group: live-security-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify-live-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix recovered-live/dependencies
      - run: npm audit --omit=dev --audit-level=moderate --prefix recovered-live/dependencies
      - run: npm ci --ignore-scripts --prefix services/whatsapp
      - run: npm audit --omit=dev --audit-level=moderate --prefix services/whatsapp
      - name: Install matching test browser
        run: node services/whatsapp/node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome
      - name: Verify portal and WhatsApp isolation, security and browser behavior
        run: node --test --test-concurrency=2 recovered-live/*.test.mjs services/whatsapp/*.test.mjs
