<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu e-mail corporativo | Affinity</title><link rel="stylesheet" href="/staff-flow.css"><style>body{background:#f4f7fa;color:#142b3c}main{max-width:1000px}button{background:#155e46;color:#fff;border:1px solid #104432}input,textarea,select{background:#fff;color:#142b3c;border:1px solid #71879a}article{background:white;border:1px solid #bacbd8;border-radius:12px;padding:16px;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}#notice{font-weight:700}label{display:block;margin:12px 0}textarea{min-height:160px}details summary{cursor:pointer;font-weight:700}small{display:block;color:#425d72}</style><script src="/assistant-email.js?v=1" defer></script></head><body><main><h1>Meu e-mail corporativo</h1><p id="address"></p><p id="notice" role="status"></p><button id="refresh">Atualizar caixa de entrada</button><details id="compose"><summary>✉ Escrever e-mail</summary><form><label>Para<input id="to" type="email" required></label><label>Assunto<input id="subject" maxlength="500" required></label><label>Mensagem<textarea id="body" maxlength="50000" required></textarea></label><label><input id="confirm" type="checkbox" required> Conferi o destinatário e autorizo enviar esta mensagem pelo meu e-mail corporativo.</label><button type="submit">✉ Confirmar e enviar e-mail</button></form></details><h2>Mensagens</h2><label>Mostrar<select id="folder"><option value="received">Recebidos</option><option value="sent">Enviados</option></select></label><div id="messages"></div></main></body></html>
