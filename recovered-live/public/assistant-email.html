<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu e-mail corporativo | Affinity</title><link rel="stylesheet" href="/staff-flow.css"><link rel="stylesheet" href="/assistant-email.css?v=2"><script src="/assistant-email.js?v=5" defer></script></head><body><main><header><div><h1>Meu e-mail corporativo</h1><p id="address"></p></div><button id="refresh">↻ Atualizar</button></header><p id="notice" role="status"></p><div class="mailbox"><aside><button id="new-message">✉ Escrever e-mail</button><h3>Pastas</h3><label>Mostrar<select id="folder"><option value="received">Caixa de entrada</option><option value="sent">Enviados</option></select></label><h3>Categorias</h3><div id="categories"></div></aside><section class="message-list"><label>Pesquisar<input id="search" type="search" placeholder="Nome, assunto ou mensagem"></label><div id="messages"></div></section><section id="reader" aria-label="Leitura da mensagem"><p>Selecione uma mensagem para ler.</p></section></div><dialog id="compose"><form><h2>Escrever e-mail</h2><p>O destinatário receberá pelo seu endereço corporativo.</p><label>Para<input id="to" type="email" required></label><label>Assunto<input id="subject" maxlength="500" required></label><label>Mensagem<textarea id="body" maxlength="50000" required></textarea></label><label class="confirmation"><input id="confirm" type="checkbox" required> Conferi o destinatário e autorizo enviar esta mensagem.</label><button type="button" id="cancel">Cancelar</button><button type="submit" class="send">✉ Confirmar e enviar e-mail</button></form></dialog></main></body></html>
