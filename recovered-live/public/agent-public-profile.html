<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Consultor | Affinity Financial</title>
    <style>
      :root {
        --gold: #dfb934;
        --navy: #0f223b;
        --muted: #b6c0cd;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font:
          16px Arial,
          sans-serif;
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px max(20px, calc((100vw - 1160px) / 2));
        background: #0f223bf2;
        border-bottom: 1px solid #594a25;
      }
      .brand {
        color: var(--gold);
        font-size: 20px;
        font-weight: 900;
        text-decoration: none;
      }
      .hero {
        min-height: 620px;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        align-items: center;
        gap: 50px;
        max-width: 1160px;
        margin: auto;
        padding: 70px 24px;
      }
      .eyebrow {
        color: var(--gold);
        font-weight: 900;
        letter-spacing: 0.17em;
        text-transform: uppercase;
        font-size: 12px;
      }
      h1 {
        font-size: clamp(42px, 7vw, 72px);
        line-height: 1.02;
        margin: 14px 0;
      }
      .headline {
        font-size: 22px;
        color: #d9e0e9;
      }
      .bio {
        color: var(--muted);
        line-height: 1.75;
        white-space: pre-line;
      }
      .photo {
        width: min(100%, 430px);
        aspect-ratio: 4/5;
        object-fit: cover;
        border-radius: 28px;
        border: 2px solid #6e5927;
        box-shadow: 0 25px 80px #0e3b6555;
      }
      .placeholder {
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #183757, #091421);
        font-size: 90px;
        color: var(--gold);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }
      .button {
        padding: 14px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 900;
        border: 1px solid #53647a;
        color: #fff;
      }
      .primary {
        background: var(--gold);
        border-color: var(--gold);
        color: #050505;
      }
      .calendar {
        background: #081321;
        border-top: 1px solid #5b4a25;
        padding: 55px 16px;
      }
      .calendar h2 {
        text-align: center;
        font-size: 38px;
        margin: 0 0 8px;
      }
      .calendar p {
        text-align: center;
        color: var(--muted);
      }
      .widget {
        max-width: 1120px;
        height: 760px;
        margin: 26px auto 0;
        background: #fff;
        border-radius: 20px;
        overflow: hidden;
      }
      .error {
        max-width: 700px;
        margin: 100px auto;
        padding: 30px;
        text-align: center;
      }
      .profile-details { background:#07111f;border-top:1px solid #5b4a25;padding:65px 20px }
      .details-wrap { max-width:1160px;margin:auto }
      .details-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px }
      .detail-card { background:#0f223b;border:1px solid #34465d;border-radius:18px;padding:24px }
      .detail-card h2 { margin:0 0 13px;color:#dfb934;font-size:22px }
      .detail-card p { white-space:pre-line;color:#c0cad6;line-height:1.7;margin:0 }
      .detail-card.wide { grid-column:1/-1 }
      .social { display:flex;flex-wrap:wrap;gap:10px;margin-top:20px }
      @media (max-width: 800px) {
        .hero {
          grid-template-columns: 1fr;
          padding: 45px 20px;
        }
        .photo {
          order: -1;
          max-height: 430px;
          margin: auto;
        }
        .widget {
          height: 820px;
          border-radius: 0;
        }
        .calendar {
          padding-left: 0;
          padding-right: 0;
        }
        .calendar h2,
        .calendar p {
          padding: 0 18px;
        }
        .details-grid { grid-template-columns:1fr }
        .detail-card.wide { grid-column:auto }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <a class="brand" href="/">Affinity Financial Consulting</a
      ><a style="color: #fff" href="/">Site principal</a>
    </header>
    <main id="content"><div class="error">Carregando perfil…</div></main>
    <script src="/agent-public-profile.js?v=20260828-2" defer></script>
  </body>
</html>
