<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha assinatura | Affinity</title><link rel="stylesheet" href="/staff-flow.css"><script src="/assistant-signature.js?v=1" defer></script></head><body><main><h1>Minha assinatura</h1><p>Usada no e-mail e no WhatsApp enviados pelo portal. A identificação do agente acompanha o agente selecionado.</p><form id="signature-form"><section><div class="grid"><label>Seu nome<input name="name" maxlength="200" required></label><label>Cargo<input name="title" maxlength="200" required></label><label>Agente representado<input name="agentName" readonly></label><label>Empresa<input name="company" maxlength="200" required></label><label>Telefone<input name="phone" type="tel" maxlength="70" required></label><label>E-mail na assinatura<input name="email" type="email" maxlength="200" required><small>Altera apenas o texto da assinatura, não o remetente corporativo.</small></label><label>Site<input name="site" maxlength="200" required></label></div><h2>Prévia</h2><pre id="preview" style="white-space:pre-wrap;background:#edf5f0;color:#163e30;padding:18px;border:1px solid #95b6a6;border-radius:10px;font:15px/1.6 system-ui"></pre><p id="status" role="status"></p><button type="submit" style="padding:14px 24px;background:#166534;color:#fff;border:2px solid #14532d;font-weight:800">Salvar assinatura</button></section></form></main></body></html>
