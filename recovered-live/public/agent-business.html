<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil profissional | Affinity Portal</title><link rel="stylesheet" href="/material-library.css?v=3"><style>.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.profile-photo-row{display:flex;gap:22px;align-items:center;margin:12px 0 26px;flex-wrap:wrap}.profile-photo{width:112px;height:112px;object-fit:cover;border:1px solid #afc1ce;border-radius:50%;background:#eaf0f5}.profile-photo-placeholder{display:grid;place-items:center;font-size:38px;font-weight:800;color:#31546c}.profile-photo-actions{display:grid;gap:8px}.profile-photo-actions input{max-width:360px}#personal-page{margin:22px 0;padding:18px;border:1px solid #a5c6b5;border-radius:10px;background:#eff8f2}#personal-page a{color:#175d3e;font-weight:750;overflow-wrap:anywhere}#business-form textarea{width:100%;min-height:140px;font:15px/1.5 Arial}#business-form details{margin:22px 0}#business-form summary{font-weight:750;cursor:pointer}#business-form label{margin:10px 0}#business-form .profile-save{align-self:flex-start;padding:12px 24px;margin-top:20px}#business-status:empty{display:none}</style><script src="/agent-business.js?v=2" defer></script></head><body id="material-library-page" class="material-library"><main class="main"><h1>Perfil profissional</h1><p>Seus dados, foto, assinatura e página pessoal em um só lugar.</p><form id="business-form" class="material"><div class="profile-photo-row"><img id="profile-photo" class="profile-photo" alt="Sua foto profissional" hidden><div id="profile-photo-placeholder" class="profile-photo profile-photo-placeholder" aria-hidden="true"></div><div class="profile-photo-actions"><label>Foto profissional (opcional)<input id="profile-photo-file" type="file" accept="image/jpeg,image/png,image/webp"></label><small>JPG, PNG ou WebP. A imagem será ajustada automaticamente.</small><button id="send-photo-link" type="button">Tirar foto pelo celular — receber link por e-mail</button><button id="remove-profile-photo" type="button" hidden>Remover foto</button></div></div><div class="profile-grid"><label>Nome completo<input name="name" required maxlength="160" autocomplete="name"></label><label>Telefone profissional<input name="phone" type="tel" maxlength="70" autocomplete="tel"></label><label>E-mail profissional de contato<input name="contactEmail" type="email" maxlength="254" autocomplete="email"><small>Este contato não altera seu e-mail de login.</small></label><label>Empresa ou nome profissional<input name="company" maxlength="160"></label><label>Cargo<input name="title" maxlength="100"></label><label>Site próprio (opcional)<input name="website" maxlength="300" placeholder="https://seusite.com"><small>Não tem site? Sua página pessoal abaixo será usada.</small></label></div><section id="personal-page" hidden><strong>Sua página pessoal</strong><p><a id="personal-page-link" target="_blank" rel="noopener"></a></p><small id="personal-page-state"></small></section><details><summary>Outros dados de contato</summary><label>WhatsApp profissional<input name="whatsapp" type="tel" maxlength="70"></label><label>Endereço profissional<input name="address" maxlength="1000"></label></details><details id="public-profile-settings"><summary>Página pública do agente</summary><p>Apresente seu trabalho e escolha as informações que ficarão visíveis para os clientes.</p><div id="public-profile-fields" class="profile-grid"></div><label><input name="publicPublished" type="checkbox" style="width:auto;min-height:0"> Publicar minha página pessoal</label></details><label>Assinatura dos e-mails<textarea name="messageSignature" maxlength="2000"></textarea></label><button class="primary profile-save" type="submit">Salvar perfil profissional</button><p id="business-status" role="status" aria-live="polite"></p></form></main></body></html>
