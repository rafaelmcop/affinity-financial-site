<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliar atendimento | Affinity</title><style>*{box-sizing:border-box}body{margin:0;background:#02060c;color:#fff;font:15px Arial}.wrap{max-width:700px;margin:auto;padding:35px 18px}.brand,h1{color:#dfb934}.card{background:#0b1524;border:1px solid #564923;border-radius:18px;padding:24px}.grid{display:grid;gap:14px}label{color:#d1d5db}input,select,textarea{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #344155;border-radius:8px;background:#02060c;color:#fff}textarea{min-height:130px}button{padding:12px 18px;background:#dfb934;border:0;border-radius:9px;font-weight:bold}.msg{margin-top:15px;padding:12px;background:#123524;border-radius:8px}</style></head><body><main class="wrap"><div class="brand">Affinity Financial Consulting</div><h1>Avalie seu atendimento</h1><section class="card"><div class="grid"><label>Nome<input id="name"></label><label>E-mail<input id="email" type="email"></label><label>Cidade<input id="city"></label><label>Estado<select id="state"></select></label><label>Nota de 1 a 5<input id="rating" type="number" min="1" max="5"></label><label>Conte como foi seu atendimento<textarea id="quote"></textarea></label><button id="send">Enviar avaliação</button><div id="msg"></div></div></section></main><script src="/avaliacao-convite.js?v=1"></script></body></html>
