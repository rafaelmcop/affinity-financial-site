<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliar atendimento | Affinity</title><style>*{box-sizing:border-box}body{margin:0;background:#02060c;color:#fff;font:15px Arial}.wrap{max-width:700px;margin:auto;padding:35px 18px}.brand{color:#dfb934;font-size:20px;font-weight:800}h1{font:38px Georgia;margin-bottom:8px}.subtitle{color:#aeb7c5;line-height:1.6}.card{background:#0b1524;border:1px solid #564923;border-radius:18px;padding:26px;margin-top:22px}.grid{display:grid;gap:18px}label{color:#d1d5db;font-weight:700}input,textarea{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #344155;border-radius:8px;background:#02060c;color:#fff}textarea{min-height:150px}.stars{display:flex;gap:8px;margin-top:10px}.star{border:0;background:transparent;color:#657080;font-size:42px;line-height:1;padding:0;cursor:pointer}.star.filled{color:#dfb934}.rating-text{color:#9ca3af;font-size:13px}button.send{padding:13px 18px;background:#dfb934;color:#000;border:0;border-radius:9px;font-weight:800;cursor:pointer}.msg{margin-top:15px;padding:12px;background:#123524;border-radius:8px}.thanks{color:#a7f3d0;text-align:center;font-size:16px;line-height:1.6}</style></head><body><main class="wrap"><div class="brand">Affinity Financial Consulting</div><h1>Como foi seu atendimento?</h1><p class="subtitle">Sua opinião é muito importante para nós e nos ajuda a oferecer um atendimento cada vez melhor.</p><section class="card"><div class="grid"><div><label>Sua avaliação</label><div id="stars" class="stars" role="radiogroup" aria-label="Nota de uma a cinco estrelas"></div><div id="rating-text" class="rating-text">Selecione de 1 a 5 estrelas</div></div><label>Deixe uma mensagem sobre seu atendimento<textarea id="quote" required placeholder="Conte-nos como foi sua experiência..."></textarea></label><div id="followup-fields" class="grid" hidden><label>O que fez você decidir pensar um pouco mais antes de avançar?<textarea id="reason" placeholder="Conte-nos o principal motivo..."></textarea></label><label>Ficou alguma dúvida ou assunto que gostaria que explicássemos melhor?<textarea id="doubts" placeholder="Escreva suas dúvidas ou pontos que gostaria de rever..."></textarea></label></div><button id="send" class="send">Enviar avaliação</button><div id="msg"></div><p class="thanks">Agradecemos pela confiança e por dedicar um momento para compartilhar sua experiência. 💙</p></div></section></main><script src="/avaliacao-convite.js?v=20260901-4"></script></body></html>
