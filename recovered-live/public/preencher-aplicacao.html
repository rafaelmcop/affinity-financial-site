<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preencher aplicação | Affinity Financial</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#14233b;font:15px Arial}.wrap{max-width:900px;margin:auto;padding:30px 18px}.brand{color:#155a9c;font-size:22px;font-weight:bold}h1{font:36px Georgia}.card{background:#fff;border:1px solid #b3c4d3;border-radius:18px;padding:22px;margin-top:20px}.grid{display:grid;gap:14px}label{color:#34445a;font-size:13px}input,textarea{display:block;width:100%;margin-top:6px;padding:11px;border-radius:8px;border:1px solid #9fb1c4;background:#fff;color:#14233b}textarea{min-height:80px}.wide{grid-column:1/-1}button{background:#dfb934;color:#000;border:0;border-radius:9px;padding:12px 18px;font-weight:bold;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.hidden,.completed-field{display:none!important}.secure{color:#166534}.pending-summary{background:#edf4fa;border:1px solid #b3c4d3;border-radius:10px;padding:12px;margin-bottom:14px;color:#17324d}.notice{padding:12px;background:#123524;border-radius:8px;margin-top:12px}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}#client-steps{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}#client-steps button{background:#edf2f7;color:#17324d;border:1px solid #9fb1c4;padding:11px 14px}#client-steps button[aria-current=step]{background:#155a9c;color:#fff;border-color:#155a9c}.client-step{border:1px solid #b3c4d3;padding:20px;border-radius:12px;background:#fff;color:#14233b}.client-step legend{padding:0 8px;font-weight:700}.step-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}#next-step{background:#166534;color:#fff}#save{background:#155a9c;color:#fff}#previous-step{background:#edf2f7;color:#17324d}button:focus-visible{outline:3px solid #d49c14;outline-offset:3px}.notice{background:#e8f4eb;color:#14532d}#msg[role=alert] .notice{background:#fff0ed;color:#8b1e14}</style></head><body><main class="wrap"><div class="brand">Affinity Financial Consulting</div><h1>Concluir seu cadastro</h1><p id="access-intro">Verificando seu link privado…</p><section id="gate" class="card hidden"><label>Código de acesso<input id="code" maxlength="8" autocomplete="one-time-code"></label><button id="enter">Acessar formulário</button><div id="gate-msg" role="alert"></div></section><p id="link-error" class="notice hidden" role="alert"></p><button id="retry-access" type="button" class="hidden">Tentar abrir novamente</button><section id="application" class="card hidden"><p class="secure">Seus dados são protegidos e enviados somente ao agente responsável.</p><div id="pending-summary" class="pending-summary"></div><nav id="client-steps" aria-label="Quadros do cadastro"></nav><h2 id="current-step-title" tabindex="-1"></h2><form id="form"></form><div class="step-actions"><button id="previous-step" type="button">Anterior</button><button id="save" type="button">Salvar quadro</button><button id="next-step" type="button">Salvar e continuar</button></div><div id="msg"></div></section></main><script src="/preencher-aplicacao.js?v=20261118-sections"></script><script src="/address-autocomplete.js?v=20261108-address-1" defer></script></body></html>
