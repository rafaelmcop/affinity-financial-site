<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logs do sistema | Affinity</title><style>body{font:15px Arial}main{padding:36px;max-width:1200px;margin:auto}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #cbd7e1;text-align:left}button{padding:10px 18px;border-radius:8px;cursor:pointer}.table-wrap{overflow:auto}</style><main><h1>Logs do sistema</h1><p>Eventos técnicos de sincronização. Acesso exclusivo da administração.</p><details style="margin:20px 0;padding:16px;border:1px solid #91a7b9;border-radius:10px"><summary>Verificar conexão de e-mail · sem enviar mensagens</summary><p>Teste de conexão e autenticação SMTP. Não retoma campanhas antigas.</p><form id="mail-check"><label>E-mail do usuário <input id="mail-owner" type="email" required style="padding:10px;border:1px solid #71879a;border-radius:6px;background:white;color:#142b3c"></label> <label style="display:block;margin:12px 0"><input id="resume-future" type="checkbox"> Após verificar com sucesso, liberar somente os próximos ciclos. Não retomar campanhas antigas.</label><button type="submit">Verificar conexão</button></form><p id="mail-result" role="status"></p></details><label>Exibir <select id="log-scope" style="padding:10px;background:#fff;color:#142b3c;border:1px solid #71879a;border-radius:8px"><option value="pending">Pendências atuais</option><option value="all">Histórico completo</option></select></label> <button id="refresh">Atualizar</button><p id="log-summary" role="status"></p><p id="error" role="alert"></p><div class="table-wrap"><table><thead><tr><th>Data · Nova York</th><th>Usuário</th><th>Evento</th><th>Situação</th><th>Contatos</th><th>Detalhes</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="/admin-system-logs.js?v=5" defer></script></html>
