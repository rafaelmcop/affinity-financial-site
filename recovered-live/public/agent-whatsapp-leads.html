<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leads do WhatsApp | CRM Affinity</title><link rel="stylesheet" href="/agent-whatsapp-leads.css"></head><body><nav><a href="/agentes/crm">CRM</a><a href="/agentes/whatsapp">WhatsApp</a><b>Leads do WhatsApp</b></nav><main><h1>Leads do WhatsApp</h1><p>Contatos extraídos dos grupos selecionados pelo agente. Origem: WhatsApp.</p><section><h2>Importar participantes de um grupo</h2><select id="groups" aria-label="Grupo do WhatsApp"><option value="">Carregando grupos…</option></select><button id="import">Importar para leads</button><button id="allGroupsCsv">Baixar contatos de todos os grupos</button><p id="allGroupsStatus" role="status"></p><p id="importStatus" role="status"></p></section><section><h2>Etapas do atendimento</h2><label>Uma etapa por linha<textarea id="stages" rows="4"></textarea></label><button id="saveStages">Salvar etapas</button><p id="stageStatus" role="status"></p></section><section><h2>Lista de leads</h2><div class="filters"><input id="search" placeholder="Buscar nome ou telefone" aria-label="Buscar lead"><select id="stageFilter" aria-label="Filtrar por etapa"></select><select id="groupFilter" aria-label="Filtrar por grupo"></select><span>Origem: WhatsApp</span><button id="csv">Exportar CSV filtrado</button></div><p id="count" role="status"></p><div class="table"><table><thead><tr><th>Nome</th><th>Telefone</th><th>Origem</th><th>Grupos</th><th>Etapa</th><th>Extraído em</th></tr></thead><tbody id="leads"></tbody></table></div></section><p id="error" role="alert"></p></main><script type="module" src="/agent-whatsapp-leads.js"></script></body></html>
