<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fila de atendimento | Affinity</title><link rel="stylesheet" href="/staff-flow.css"></head><body><nav><b>Affinity · Fila de atendimento</b></nav><main><h1>Um contato por vez</h1><p>Registre o resultado antes de avançar. Contatos encerrados saem das filas de todos os agentes e ficam com os Admins.</p><p id="error" role="alert"></p><section><div class="toolbar"><label>Filtrar etapa<select id="filter"><option value="">Todas</option></select></label><button id="refresh">Consultar fila</button></div><p id="status" role="status"></p></section><section id="lead" hidden><h2 id="name"></h2><p><a id="phone"></a></p><p id="stage"></p><div id="sources"></div><p id="attempts"></p><details><summary>Histórico de atendimento</summary><div id="history"></div></details><form id="result"><label>Resultado<select id="response" required><option value="">Selecione</option><option>Respondeu</option><option>Sem resposta</option><option>Reunião marcada</option></select></label><label>Tentativas realizadas neste atendimento<input id="tries" type="number" min="1" max="100" required></label><label>Etapa após o contato<select id="new-stage" required><option value="">Selecione</option></select></label><label>Data da reunião ou próximo retorno (se marcado)<input id="appointment" type="datetime-local"></label><label>Como foi o contato?<textarea id="note" maxlength="2000" required></textarea></label><p><button id="advance">Salvar resultado e avançar</button></p></form></section></main><script type="module" src="/central-leads-agent.js"></script></body></html>
