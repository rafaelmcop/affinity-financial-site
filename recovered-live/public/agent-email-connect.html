<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect email | Affinity Portal</title><link rel="stylesheet" href="/material-library.css?v=3"><script src="/gmail-setup-guide.js?v=1" defer></script><script src="/agent-email-connect.js?v=4" defer></script></head><body id="material-library-page" class="material-library"><main class="main"><h1>Conectar meu e-mail</h1><p>Você pode configurar depois. Escolha seu provedor. Sua conta e suas mensagens ficam vinculadas somente ao seu usuário.</p><form id="email-connect" class="material"><label>Provedor<select name="provider"><option value="gmail">Gmail / Google Workspace</option><option value="icloud">iCloud</option><option value="outlook">Outlook / Microsoft 365</option><option value="custom">Outro provedor</option></select></label><div id="oauth-buttons" class="actions"></div><section id="provider-help"></section><label>Seu endereço de e-mail<input name="address" type="email" required autocomplete="email"></label><label>Seu nome como remetente<input name="senderName" required maxlength="160"></label><label>Login do provedor (se diferente do endereço acima)<input name="login" type="email" autocomplete="username"></label><label id="app-password-label">Senha de aplicativo<input name="password" type="password" autocomplete="new-password"></label><details id="server-settings"><summary>Configuração avançada de servidores</summary><label>Servidor SMTP<input name="host"></label><label>Porta SMTP<input name="port" type="number" value="465"></label><label>Servidor IMAP<input name="imapHost"></label><label>Porta IMAP<input name="imapPort" type="number" value="993"></label></details><div class="actions"><button class="primary" id="save-email">Salvar e verificar conexão</button><button type="button" id="check-email-connection">Verificar conexão sem enviar e-mail</button><button type="button" id="email-later">Configurar depois</button></div><p id="email-connect-status" role="status"></p></form></main></body></html>
