<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus clientes | Affinity</title><link rel="stylesheet" href="/staff-flow.css"><style>nav{display:none!important}main{max-width:640px;margin:0 auto;padding:20px 16px}h1{font-size:24px;margin:0 0 8px}.intro{color:#546b7b;font-size:14px}.filters{display:grid;gap:12px;margin:22px 0}label{margin:0;font-size:14px}input,select{display:block;width:100%;max-width:none!important;margin-top:7px;min-height:48px;background:white}.client{padding:18px;background:white;border-radius:16px;border:1px solid #dbe4e9;margin:12px 0}.client h2{font-size:19px;margin:0 0 8px;overflow-wrap:anywhere}.client p{color:#546b7b;font-size:14px;margin:8px 0}.client .badge{display:inline-block;font-size:13px}#status{font-size:14px;color:#546b7b}#refresh{min-height:44px}</style></head><body><main><h1>Meus clientes</h1><p class="intro">Consulte a etapa dos seus clientes no CRM.</p><div class="filters"><label>Buscar nome ou telefone<input id="search" type="search" placeholder="Nome ou telefone" autocomplete="off"></label><label>Etapa<select id="stage-filter"><option value="">Todas as etapas</option></select></label></div><button id="refresh">Atualizar clientes</button><p id="error" role="alert"></p><p id="status" role="status">Carregando…</p><div id="clients"></div></main><script type="module" src="/mobile-crm.js?v=1"></script></body></html>
