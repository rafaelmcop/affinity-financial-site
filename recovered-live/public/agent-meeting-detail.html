<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Compromisso | Affinity</title>
    <style>
      :root {
        --gold: #dfb934;
        --card: #0b1728;
        --line: #293b52;
        --muted: #9ca8b8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font:
          15px Arial,
          sans-serif;
      }
      .main {
        margin-left: 260px;
        padding: 38px;
        max-width: 1100px;
      }
      .eyebrow {
        color: var(--gold);
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 12px;
      }
      h1 {
        font-size: 40px;
        margin: 8px 0;
      }
      .muted {
        color: var(--muted);
        line-height: 1.55;
      }
      .card {
        margin-top: 20px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 17px;
        padding: 24px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 20px;
      }
      .field {
        background: #050d18;
        border-radius: 11px;
        padding: 14px;
      }
      .field b {
        display: block;
        color: var(--gold);
        margin-bottom: 6px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }
      .actions a {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #101d2d;
        color: #fff;
        padding: 12px 16px;
        font-weight: 800;
        text-decoration: none;
      }
      .actions .primary {
        background: var(--gold);
        border-color: var(--gold);
        color: #050505;
      }
      html[data-agent-theme="light"] #content .actions a {
        background: #eaf0f5 !important;
        color: #172b3a !important;
        border-color: #94a3b8 !important;
      }
      html[data-agent-theme="light"] #content .actions a.primary {
        background: #dfb934 !important;
        color: #142238 !important;
        border-color: #b28c12 !important;
      }
      html[data-agent-theme="light"] #content .actions a:hover {
        outline: 2px solid #526779;
        outline-offset: 2px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 30px;
      }
      @media (max-width: 899px) {
        .main {
          margin: 0;
          padding: 22px 16px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        h1 {
          font-size: 31px;
        }
      }
    </style>
  <style>
.actions button{font:700 14px Lato,Arial,sans-serif;min-height:40px;border:1px solid var(--agent-border,#40566d);border-radius:9px;padding:10px 14px;cursor:pointer}
#meeting-attachments{display:block;width:100%;max-width:600px;padding:10px;border:1px solid var(--agent-border,#40566d);border-radius:9px;margin:8px 0;font:14px Lato,Arial,sans-serif}
#meeting-attachment-list li{margin:10px 0;overflow-wrap:anywhere}
#meeting-attachment-list button{margin-left:10px;border-radius:7px;padding:7px 10px;cursor:pointer}
</style><link rel="stylesheet" href="/meeting-zoom-button.css?v=2"></head>
  <body data-portal-page="meeting">
    <main class="main">
      <div class="eyebrow">Agenda de hoje</div>
      <h1>Detalhes do compromisso</h1>
      <p class="muted">Somente as informações da reunião escolhida.</p>
      <div id="content" class="card empty">Carregando compromisso…</div>
    </main>
    <script src="/agent-meeting-detail.js?v=20261014-message-channel-21" defer></script>
    <script src="/agent-unified-menu.js?v=20260907-4" defer></script>
  </body>
</html>
